name: test-docker

on:
  pull_request:
    branches:
      - '**'
  workflow_call:
    inputs:
      check-service-test:
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rspec:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v4
      - name: Resolve image name
        id: image
        run: echo "name=$(docker compose config --images python-cpu)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/cpu/Dockerfile
          target: dev
          load: true
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha,scope=python-cpu
          cache-to: type=gha,mode=max,scope=python-cpu
      - name: Setup docker
        shell: bash
        run: |
          docker compose up -d --no-build
      - name: Test
        run: docker compose exec python-cpu uv run tox
